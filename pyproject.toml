[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maritime-cbm"
version = "0.1.0"
description = "Marine gas turbine degradation-state estimation PoC"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "joblib>=1.4,<2.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1,<2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0",
    "pytest>=8.0",
    "ruff>=0.9",
]
eda = [
    "matplotlib>=3.11.2",
]
modeling = [
    "torch>=2.14,<2.15",
]
service = [
    { include-group = "modeling" },
    "fastapi>=0.141.1,<1.0",
    "pydantic>=2.13.5,<3.0",
    "uvicorn>=0.53.0,<1.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires local raw UCI release files",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"
extend-exclude = [
    "/artifacts",
    "/checkpoints",
    "/data",
    "/mlruns",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
