name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Check lock file
        run: uv lock --check

      - name: Sync dependencies
        run: uv sync --locked --group eda --group modeling

      - name: Show environment
        run: |
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
          . /etc/os-release
          echo "${PRETTY_NAME}"
          uname -srm
          uv --version
          uv run --locked --group eda --group modeling python --version
          uv run --locked --group eda --group modeling python -c "import torch; print(torch.__version__)"

      - name: Lint
        run: uv run --locked --group eda --group modeling ruff check .

      - name: Check formatting
        run: uv run --locked --group eda --group modeling ruff format --check .

      - name: Test
        run: uv run --locked --group eda --group modeling pytest -q
